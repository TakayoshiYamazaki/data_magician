name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 pyinstaller

      - name: Build Windows exe with PyInstaller
        run: |
          flet pack csv_converter.py --name DataMagician --icon dmagician.ico --add-data "formats;formats" --add-data "config.json;."

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: DataMagician-Windows
          path: dist/DataMagician.exe
